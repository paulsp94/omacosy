# OmniWM settings for omacosy — FULL canonical file, schemaVersion 1
# (0.6.4). Upgrades migrate automatically (backup: settings.toml.pre-v1*).
# Hyper+arrows bind moveColumn.* — on dwindle that is the true tile
# SWAP; plain move.* (Ctrl+Opt+Shift+arrows) STACKS into the neighbor
# as a group. Migration strips comments and reorders tables: the repo
# copy is the reference, the live copy is state; theme-set rewrites
# [borders.color] per theme. Mirrored 2026-08-31, live-verified.
monitorBarOverrides = []
monitorDwindleOverrides = []
monitorGapOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []
schemaVersion = 1

[appearance]
mode = "dark"

[borders]
enabled = true
width = 5.0

[borders.color]
alpha = 1.0
blue = 0.4588235294117647
green = 0.5803921568627451
red = 0.3137254901960784

[clipboard]
historyEnabled = true
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.4
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = true
followsMouse = true
followsWindowToMonitor = true
lockModifier = "off"
moveCrossesMonitorAtEdge = true
moveMouseToFocusedWindow = true
raiseOnMouseFocus = true

[gaps]
fullscreenUsesOuterGaps = false
size = 8.0

[gaps.outer]
bottom = 0.0
left = 0.0
right = 0.0
top = 42.0

[general]
animationsEnabled = true
defaultLayoutType = "dwindle"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = true
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = false

[gestures]
fingerCount = 4
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
workspaceSwipeAxis = "horizontal"
workspaceSwipeEnabled = true
workspaceSwipeFingerCount = 4

[hiddenBar]
enabled = false
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[mouseWarp]
constrainToArrangement = false
enabled = true
margin = 1

[niri]
alwaysCenterSingleColumn = false
centerFocusedColumn = "never"
containerPrimarySpanPresets = [0.3333333333333333, 0.5, 0.6666666666666666]
defaultContainerPrimarySpan = 0.5
infiniteLoop = false
singleWindowFit = "fill"
visibleContainerCount = 2

[overview]
zoom = 1.0

[overview.backdrop]
alpha = 1.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders]

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundBlurRadius = 0
backgroundEffect = "standardBlur"
enabled = false
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[routing]
mode = "custom"

[scratchpads]

[scratchpads.labels]

[statusBar]
showAppNames = false
showWorkspaceName = false
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = false
excludedBundleIDs = []
height = 24.0
hideEmptyWorkspaces = false
hideInNativeFullscreen = false
notchActiveZoneWidth = 180.0
notchMode = "moveBelowMenuBar"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showFloatingWindows = false
showLabels = true
systemStatsButton = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.iconOverrides]

